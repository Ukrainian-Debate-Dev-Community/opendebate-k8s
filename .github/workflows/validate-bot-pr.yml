---
name: validate-bot-pr

# Required status check on main (see .github/rulesets/main-protection.json).
# Purpose: gate bot PRs to image-bump-only diffs. Human PRs pass through;
# they are gated by CODEOWNERS review instead.

"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-bot-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce bot diff allowlist
        env:
          BOT_LOGIN: opendebate-bot[bot]
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "${PR_AUTHOR}" != "${BOT_LOGIN}" ]; then
            echo "PR author is ${PR_AUTHOR} (human) — gate not enforced; CODEOWNERS review applies."
            exit 0
          fi

          echo "PR author is ${BOT_LOGIN} — enforcing image-bump-only allowlist."

          # 1. Every changed file must match apps/*/kustomization.yaml
          mapfile -t changed < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No files changed — rejecting empty bot PR."
            exit 1
          fi

          for f in "${changed[@]}"; do
            if [[ ! "${f}" =~ ^apps/[^/]+/kustomization\.yaml$ ]]; then
              echo "Disallowed file in bot PR: ${f}"
              echo "Bot is only permitted to modify apps/*/kustomization.yaml"
              exit 1
            fi
          done

          # 2. Within those files, only newTag: lines may change.
          # Diff lines starting with + or - (ignoring file headers and hunks)
          # must be 'newTag:' assignments.
          bad="$(
            git diff -U0 "${BASE_SHA}" "${HEAD_SHA}" -- 'apps/*/kustomization.yaml' \
              | grep -E '^[+-][^+-]' \
              | grep -Ev '^[+-]\s*newTag:\s*\S+\s*$' \
              || true
          )"
          if [ -n "${bad}" ]; then
            echo "Bot PR contains disallowed line changes:"
            echo "${bad}"
            echo "Only 'newTag:' lines may change."
            exit 1
          fi

          echo "Bot PR passes image-bump-only allowlist."

  auto-approve:
    # Approves the PR under github-actions[bot] (distinct from PR author
    # opendebate-bot, so self-approval restriction is satisfied) for audit
    # trail, then performs a direct squash-merge as the opendebate-bot App.
    # Direct merge (not --auto) is required: GitHub's background auto-merge
    # only fires when mergeStateStatus is CLEAN and does not consult
    # bypass_actors, so it would stall at BLOCKED on the CODEOWNERS rule.
    # A direct merge API call as the App engages main-protection's
    # pull_request bypass for the opendebate-bot Integration and goes
    # through. dismiss_stale_reviews_on_push + this workflow's pull_request
    # trigger means each new push re-runs and re-approves.
    needs: validate-bot-pr
    if: github.event.pull_request.user.login == 'opendebate-bot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            -R "${{ github.repository }}" \
            --approve \
            --body "Auto-approved: image-bump diff allowlist passed."

      - name: Mint opendebate-bot installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Squash-merge as opendebate-bot
        # Call the REST merge endpoint directly. `gh pr merge` preflights
        # via GraphQL mergePullRequest, which refuses when mergeStateStatus
        # is BLOCKED without consulting bypass_actors. The REST PUT /merge
        # endpoint honors the App's bypass and goes through.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="${HEAD_SHA}"
          gh api -X DELETE \
            "repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }}"
