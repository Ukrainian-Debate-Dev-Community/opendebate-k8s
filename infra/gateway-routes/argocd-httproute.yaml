apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: eg
      namespace: argocd
      sectionName: https-argocd
  hostnames:
    - argocd.cab.uadebate.com
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
