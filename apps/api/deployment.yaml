---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: opendebate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: ghcr.io/Ukrainian-Debate-Dev-Community/opendebate-api:sha-e09b38a
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: postgres-app
